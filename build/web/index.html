
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Profile Application</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Personal Profile</h1>
            <p>Create Your Student Profile</p>
        </div>

        <form action="ProfileServlet" method="POST">

            <h2>Personal Information</h2>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name"
                       placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Student ID</label>
                <input type="text" name="studentId"
                       placeholder="Enter your student ID" required>
            </div>

            <div class="form-group">
                <label>Program</label>
                <input type="text" name="program"
                       placeholder="Enter your program" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Hobbies</label>

                <div class="hobby-options">
                    <label>
                        <input type="checkbox" name="hobbies"
                               value="Reading"> Reading
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies"
                               value="Gaming"> Gaming
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies"
                               value="Sports"> Sports
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies"
                               value="Photography"> Photography
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies"
                               value="Traveling"> Traveling
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Short Self-Introduction</label>
                <textarea name="introduction" rows="5"
                          placeholder="Tell us about yourself..."
                          required></textarea>
            </div>

            <button type="submit">Submit Profile</button>

        </form>

        <div class="footer">
            <p>Personal Profile Web Application</p>
        </div>

    </div>

</body>
</html>
